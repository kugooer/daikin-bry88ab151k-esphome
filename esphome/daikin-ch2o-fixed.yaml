# ============================================================================
# 大金 DAIKIN BRY88AB151K 空气传感器 —— 甲醛通道换装 ZE08C
#
# 硬件：ESP32-D0WDQ6（4MB Flash）+ PM2105(PM2.5) + CM1106(CO2) + SGP30(TVOC)
#       + HDC1080(温湿度) + ZE08C(HCHO，安装在原 ZE08-CH2O 位置)
#
# 派生自 https://github.com/louliangsheng/daikin-air-sensor 的
# daikin-bry88ab151k-ch2o.yaml，相对上游的三处改动：
#   1. 新版 ESPHome 移除了 custom_component 与 sensor: platform: custom，
#      驱动改为「构造时注入 Sensor*」自行推数（本配置固定在 2024.12.4 编译，
#      见 docs/03-build-env.md）
#   2. 甲醛驱动由 ze08-ch2o.h 换成 ze08c.h（两者协议完全不同，见 docs/02）
#   3. 显式补齐框架库头文件路径，绕过 lib_ldf_mode=off 的 include 排序缺陷
# ============================================================================
esphome:
  name: daikin-air-sensor
  project:
    name: "DAIKIN.BRY88AB151K"
    version: "PM2105-ZE08C"
  name_add_mac_suffix: true
  includes:
    - "ze08c.h"
    - "cm1106.h"
    - "pm2105.h"
  # lib_ldf_mode=off（ESPHome 默认）时，PlatformIO 的 piolib.py → LibBuilderBase.build()
  # 只把「已构建完成(is_built)」的库的 include 路径复制给当前库。框架内置库
  # （FS/WiFi/Update/DNSServer/ESPmDNS/Wire）的构建顺序排在 ESPAsyncWebServer 之后，
  # 于是 ESPAsyncWebServer.h 里的 #include "FS.h" 找不到文件。
  # 这里显式声明路径，与构建顺序解耦。${platformio.packages_dir} 由 PlatformIO 插值，
  # 无需修改即可跨机器使用。
  platformio_options:
    # captive_portal / web_server 都需要 ESPAsyncWebServer，但 ESPHome 2024.12.4
    # 只自动加入框架内置库（WiFi/FS/Update/DNSServer/ESPmDNS/Wire），
    # 不会加这两个第三方库 —— 缺少时会报
    #   captive_portal.cpp: fatal error: ESPAsyncWebServer.h: No such file
    # 默认用仓库内的离线副本，不依赖网络。
    # ⚠ 必须在 esphome/ 目录下执行 esphome compile（${sysenv.PWD} 取的是当前工作目录）。
    # 也可换成官方注册表版本：
    #   - esphome/AsyncTCP-esphome@2.1.4
    #   - esphome/ESPAsyncWebServer-esphome@3.2.2
    # 或 GitHub tag（注意 tag 带 v 前缀）：
    #   - https://github.com/esphome/AsyncTCP.git#v2.1.4
    #   - https://github.com/esphome/ESPAsyncWebServer.git#v3.2.2
    lib_deps:
      - "file://${sysenv.PWD}/libs/AsyncTCP-esphome"
      - "file://${sysenv.PWD}/libs/ESPAsyncWebServer-esphome"
    build_flags:
      - "-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
      - "-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src"
      - "-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Update/src"
      - "-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/DNSServer/src"
      - "-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS/src"
      - "-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Wire/src"

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

wifi:
  ap:
    ssid: "DAIKIN Fallback Hotspot"

captive_portal:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80
  version: 1

logger:
  logs:
    sgp30: WARN
    hdc1080: WARN
    sensor: WARN
    component: ERROR

uart:
  - id: cm1106_uart
    rx_pin: 16
    tx_pin: 17
    baud_rate: 9600
  # ZE08C 只需 RX（主动上传，模块每约 1 秒推一帧）。
  # tx_pin 保留是为了兼容原布线，模块端口 3(A) 可以不接。
  - id: uart_ze08
    tx_pin: 18
    rx_pin: 5
    baud_rate: 9600

i2c:
  - id: pm25_bus
    sda: 23
    scl: 22
    scan: true
  - id: th_bus
    sda: 19
    scl: 21
    scan: true

# 三个自定义驱动：读数推送到下面 template sensor 的 id
custom_component:
  # ZE08C 甲醛（主动上传，6 字节帧，注意与 ZE08-CH2O 不同）
  # 第三个参数 5 是 RX 引脚号，仅用于诊断时读引脚电平
  - lambda: |-
      auto ze08c = new WinsenZE08CSensor(id(uart_ze08), id(ze08_ch2o), 5);
      return {ze08c};
  # CM1106 CO2
  - lambda: |-
      auto co2 = new CM1106Sensor(id(cm1106_uart), id(co2sensor), 10000);
      return {co2};
  # PM2105 PM2.5
  - lambda: |-
      auto pm25 = new pm2005(id(pm25sensor));
      return {pm25};

sensor:
  - platform: template
    name: "DAIKIN CH2O Sensor"
    id: ze08_ch2o
    device_class: volatile_organic_compounds
    state_class: measurement
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 0
  - platform: template
    name: "DAIKIN CO2 Sensor"
    id: co2sensor
    device_class: carbon_dioxide
    state_class: measurement
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
  - platform: template
    name: "DAIKIN PM2.5 Sensor"
    id: pm25sensor
    device_class: pm25
    state_class: measurement
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 0
  - platform: sgp30
    i2c_id: th_bus
    compensation:
      temperature_source: temperature
      humidity_source: humidity
    eco2:
      id: eco2sensor
      internal: true
    tvoc:
      name: "DAIKIN TVOC Sensor"
      id: tvocsensor
      device_class: volatile_organic_compounds
      unit_of_measurement: "µg/m³"
      filters:
        - throttle: 15s
        - lambda: |-
            if (x * id(tvocmultiply).state > id(tvocmax).state) {
              return id(tvocmax).state;
            } else {
              return x * id(tvocmultiply).state;
            }
  - platform: hdc1080
    i2c_id: th_bus
    update_interval: 15s
    temperature:
      name: "DAIKIN Temperature Sensor"
      id: temperature
      filters:
        - lambda: return x - id(temperatureoffset).state;
    humidity:
      name: "DAIKIN Humidity Sensor"
      id: humidity
      filters:
        - lambda: return x * id(humiditymultiply).state;
        - clamp:
            max_value: 100
  - platform: wifi_signal
    name: "DAIKIN Signal"

switch:
  - platform: template
    name: "DAIKIN LED Indicator"
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:led-off
    id: indicator
    optimistic: true
  # CO2 零点校准（原 CM1106CalibrateSwitch，改为直接调用驱动）
  - platform: template
    name: "DAIKIN CO2 Calibration Trigger"
    id: calibration
    internal: true
    optimistic: true
    turn_on_action:
      - lambda: |-
          if (g_cm1106_instance != nullptr) {
            g_cm1106_instance->setCo2CalibValue();
          }
      - switch.turn_off: calibration
  - platform: gpio
    pin: 4
    id: co2led
    internal: true
  - platform: gpio
    pin: 32
    id: tvocch2oled
    internal: true
  - platform: gpio
    pin: 33
    id: pm25led
    internal: true

status_led:
  pin: 25

number:
  - platform: template
    name: "DAIKIN Threshold CO2"
    entity_category: "config"
    id: co2threshold
    optimistic: true
    unit_of_measurement: "ppm"
    min_value: 400
    max_value: 5000
    step: 100
    initial_value: 1000
    restore_value: true
  - platform: template
    name: "DAIKIN Threshold PM2.5"
    entity_category: "config"
    id: pm25threshold
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 0
    max_value: 200
    step: 10
    initial_value: 50
    restore_value: true
  - platform: template
    name: "DAIKIN Threshold CH2O"
    entity_category: "config"
    id: ch2othreshold
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 10
    max_value: 200
    step: 10
    initial_value: 100
    restore_value: true
  - platform: template
    name: "DAIKIN Threshold TVOC"
    entity_category: "config"
    id: tvocthreshold
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 0
    max_value: 20000
    step: 1000
    initial_value: 1000
    restore_value: true
  - platform: template
    name: "DAIKIN TVOC MAX"
    entity_category: "config"
    id: tvocmax
    optimistic: true
    unit_of_measurement: "µg/m³"
    min_value: 5000
    max_value: 20000
    step: 1000
    initial_value: 10000
    restore_value: true
  - platform: template
    name: "DAIKIN TVOC Multiply"
    entity_category: "config"
    id: tvocmultiply
    optimistic: true
    min_value: 1
    max_value: 5
    step: 0.1
    initial_value: 3
    restore_value: true
  - platform: template
    name: "DAIKIN Humidity Multiply"
    entity_category: "config"
    id: humiditymultiply
    optimistic: true
    min_value: 1
    max_value: 1.6
    step: 0.01
    initial_value: 1.4
    restore_value: true
  - platform: template
    name: "DAIKIN Temperature Offset"
    entity_category: "config"
    id: temperatureoffset
    optimistic: true
    min_value: 0
    max_value: 10
    step: 0.1
    initial_value: 6
    restore_value: true

binary_sensor:
  - platform: template
    internal: true
    id: tvocch2olambda
    lambda: |-
      if (id(indicator).state == true) {
        if (id(ze08_ch2o).state > id(ch2othreshold).state || id(tvocsensor).state > id(tvocthreshold).state) {
          return true;
        } else {
          return false;
        }
      } else {
        return false;
      }
    on_press:
      then:
        - switch.turn_on: tvocch2oled
    on_release:
      then:
        - switch.turn_off: tvocch2oled
  - platform: template
    internal: true
    id: co2lambda
    lambda: |-
      if (id(indicator).state == true) {
        if (id(co2sensor).state > id(co2threshold).state) {
          return true;
        } else {
          return false;
        }
      } else {
        return false;
      }
    on_press:
      then:
        - switch.turn_on: co2led
    on_release:
      then:
        - switch.turn_off: co2led
  - platform: template
    internal: true
    id: pm25lambda
    lambda: |-
      if (id(indicator).state == true) {
        if (id(pm25sensor).state > id(pm25threshold).state) {
          return true;
        } else {
          return false;
        }
      } else {
        return false;
      }
    on_press:
      then:
        - switch.turn_on: pm25led
    on_release:
      then:
        - switch.turn_off: pm25led
  - platform: template
    internal: true
    id: co2_calibration
    lambda: |-
      if (id(co2sensor).state == 400) {
        return true;
      } else {
        return false;
      }
    filters:
      - delayed_on: 5min
    on_press:
      then:
        - switch.turn_on: calibration
  - platform: gpio
    pin: 34
    id: reset_button
    internal: true
    on_press:
      then:
        - button.press: reset

button:
  - platform: restart
    name: "DAIKIN Restart"
    entity_category: "diagnostic"
  - platform: factory_reset
    id: reset
    internal: true
  - platform: template
    name: "DAIKIN CO2 Calibration"
    entity_category: "diagnostic"
    on_press:
      then:
        - switch.turn_on: calibration
